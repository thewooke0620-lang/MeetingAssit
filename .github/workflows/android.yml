# 회의 통역 도우미 안드로이드 앱(APK) 만들기
# GitHub 서버에서 Capacitor 로 웹 앱을 감싸 APK 를 만든다. 결과는 이 실행의 Artifacts 에서 받는다.
# 앱 화면은 웹 앱 주소를 불러오므로, 웹을 고치면 APK 를 다시 깔지 않아도 반영된다.
name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write   # 만든 APK 를 apk 브랜치에 올리기 위해

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor 설치와 안드로이드 프로젝트 만들기
        working-directory: android
        run: |
          npm ci
          npx cap add android
          npx cap sync android

      - name: 권한(마이크·폰 소리·떠 있는 창), 화면 켜 두기, 아이콘
        working-directory: android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          # 마이크로 회의 소리를 들어야 한다
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$M"
          grep -q RECORD_AUDIO "$M"
          # 앱을 나가도 계속 듣기: 알림이 뜨는 포그라운드 서비스(마이크 종류)와 알림 권한
          sed -i 's#<uses-permission android:name="android.permission.RECORD_AUDIO" />#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$M"
          sed -i 's#</application>#    <service android:name=".MeetingService" android:exported="false" android:foregroundServiceType="microphone" />\n    </application>#' "$M"
          grep -q FOREGROUND_SERVICE_MICROPHONE "$M"
          grep -q MeetingService "$M"
          # 폰 소리 듣기(실험): 화면·소리 캡처 서비스 / 떠 있는 자막 창: 다른 앱 위에 표시
          sed -i 's#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />#' "$M"
          sed -i 's#</application>#    <service android:name=".CaptureService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>#' "$M"
          grep -q FOREGROUND_SERVICE_MEDIA_PROJECTION "$M"
          grep -q SYSTEM_ALERT_WINDOW "$M"
          grep -q CaptureService "$M"
          cp CaptureService.java android/app/src/main/java/io/github/thewooke0620/meetingassit/CaptureService.java
          cp FloatWindow.java android/app/src/main/java/io/github/thewooke0620/meetingassit/FloatWindow.java
          cp MainActivity.java android/app/src/main/java/io/github/thewooke0620/meetingassit/MainActivity.java
          cp MeetingService.java android/app/src/main/java/io/github/thewooke0620/meetingassit/MeetingService.java
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r res/* android/app/src/main/res/

      - name: APK 빌드 (디버그 서명)
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/MeetingAssit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingAssit-apk
          path: out/MeetingAssit.apk
          retention-days: 30

      # 폰에서 바로 받을 수 있게 apk 브랜치에 올린다 (기록을 남기지 않고 매번 덮어쓴다)
      # 받는 주소: https://github.com/thewooke0620-lang/MeetingAssit/raw/apk/MeetingAssit.apk
      - name: apk 브랜치에 올리기
        run: |
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk
          git add MeetingAssit.apk
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
